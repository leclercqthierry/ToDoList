<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ajouter une catégorie</title>
        <link rel="stylesheet" href="./assets/css/style.css" />
    </head>
    <body class="font(font-family:'Arial', sans-serif) m-0 bg-gray-200 p-0">
        <header>
            <nav class="bg-gray-950 p-4">
                <div
                    class="cursor-pointer text-2xl text-white transition-transform duration-500 md:hidden"
                    id="menu-toggle"
                >
                    <div
                        class="mb-1 h-1 w-6 bg-white transition-transform"
                        id="bar1"
                    ></div>
                    <div
                        class="mb-1 h-1 w-6 bg-white transition-opacity"
                        id="bar2"
                    ></div>
                    <div
                        class="h-1 w-6 bg-white transition-transform"
                        id="bar3"
                    ></div>
                </div>
                <ul
                    class="hidden flex-col items-center text-white md:flex md:flex-row md:gap-4"
                    id="menu"
                >
                    <li class="text-center">
                        <a href="category.html" class="hover:text-gray-400"
                            >Ajouter/Supprimer une catégorie</a
                        >
                    </li>
                    <li class="text-center">
                        <a href="index.html" class="hover:text-gray-400"
                            >Liste de tâches</a
                        >
                    </li>
                </ul>
            </nav>
        </header>
        <h1
            class="mt-2.5 mb-2.5 text-center text-3xl font-bold text-black uppercase"
        >
            Catégories
        </h1>
        <main
            class="flex flex-col items-center justify-center md:flex-row md:justify-evenly"
        >
            <section>
                <h2
                    class="mt-2.5 mb-2.5 text-center text-2xl font-bold text-blue-600 uppercase"
                >
                    Ajouter une catégorie
                </h2>
                <form
                    id="addCategoryForm"
                    class="mx-auto my-4 w-full max-w-xs rounded-lg bg-white p-4 shadow-md sm:max-w-sm"
                >
                    <label
                        for="categoryName"
                        class="block text-xs font-medium text-gray-700 sm:text-sm"
                        >Catégorie :</label
                    >
                    <input
                        type="text"
                        id="categoryName"
                        placeholder="Nom de la catégorie"
                        class="mt-1 w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring focus:ring-green-500 focus:outline-none"
                    />
                    <input
                        type="submit"
                        value="Ajouter"
                        class="mt-4 w-full cursor-pointer rounded-md bg-green-600 p-2 text-white hover:bg-green-500 focus:ring focus:ring-green-500 focus:outline-none"
                    />
                </form>
            </section>
            <section>
                <h2
                    class="mt-2.5 mb-2.5 text-center text-2xl font-bold text-blue-600 uppercase"
                >
                    Supprimer une catégorie
                </h2>
                <form
                    id="deleteCategoryForm"
                    class="mx-auto my-4 w-full max-w-xs rounded-lg bg-white p-4 shadow-md sm:max-w-sm"
                >
                    <label
                        for="deleteCategory"
                        class="block text-xs font-medium text-gray-700 sm:text-sm"
                        >Catégorie :</label
                    >
                    <select
                        id="deleteCategory"
                        class="mt-1 w-full rounded-md border border-gray-300 p-2 focus:ring focus:ring-red-500 focus:outline-none"
                    >
                        <option value="" selected disabled>
                            Choisir une catégorie
                        </option>
                    </select>
                    <input
                        type="submit"
                        value="Supprimer"
                        class="mt-4 w-full cursor-pointer rounded-md bg-red-600 p-2 text-white hover:bg-red-500 focus:ring focus:ring-red-500 focus:outline-none"
                    />
                </form>
            </section>
        </main>
        <script src="./assets/js/menu.js"></script>
        <script src="./assets/js/addCategory.js" type="module"></script>
        <script src="./assets/js/deleteCategory.js"></script>
    </body>
</html>
