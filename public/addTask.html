<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Ajouter une tâche</title>
    </head>
    <body class="font(font-family:'Arial', sans-serif) m-0 bg-gray-200 p-0">
        <header>
            <nav class="bg-gray-950 p-4">
                <div
                    class="cursor-pointer text-2xl text-white transition-transform duration-500 md:hidden"
                    id="menu-toggle"
                >
                    <div
                        class="mb-1 h-1 w-6 bg-white transition-transform"
                        id="bar1"
                    ></div>
                    <div
                        class="mb-1 h-1 w-6 bg-white transition-opacity"
                        id="bar2"
                    ></div>
                    <div
                        class="h-1 w-6 bg-white transition-transform"
                        id="bar3"
                    ></div>
                </div>
                <ul
                    class="hidden flex-col items-center text-white md:flex md:flex-row md:gap-4"
                    id="menu"
                >
                    <li class="text-center">
                        <a href="category.html" class="hover:text-gray-400"
                            >Ajouter/Supprimer une catégorie</a
                        >
                    </li>
                    <li class="text-center">
                        <a href="addTask.html" class="hover:text-gray-400"
                            >Ajouter une tâche</a
                        >
                    </li>
                    <li class="text-center">
                        <a href="index.html" class="hover:text-gray-400"
                            >Liste de tâches</a
                        >
                    </li>
                </ul>
            </nav>
        </header>
        <h1
            class="mt-2.5 mb-2.5 text-center text-3xl font-bold text-black uppercase"
        >
            Ajouter une tâche
        </h1>
        <main>
            <form
                id="taskForm"
                class="mx-auto my-4 w-full max-w-xs rounded-lg bg-white p-4 shadow-md sm:max-w-sm"
            >
                <p class="mb-4 text-xs text-gray-500 sm:text-sm">
                    Les champs précédés d'un astérisque rouge
                    <sup class="text-red-500"><b>*</b></sup> sont obligatoires.
                </p>
                <label
                    for="category"
                    class="block text-xs font-medium text-gray-700 sm:text-sm"
                    >Catégorie<sup class="text-red-500"><b>*</b></sup> :</label
                >
                <select
                    name="category"
                    id="category"
                    class="mt-1 w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring focus:ring-indigo-500 focus:outline-none"
                >
                    <option value="" selected disabled>
                        Choisir une catégorie
                    </option>
                </select>
                <label
                    for="taskTitle"
                    class="mt-1 block text-xs font-medium text-gray-700 sm:text-sm"
                    >Tâche<sup class="text-red-500"><b>*</b></sup> :</label
                >
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Titre de la tâche"
                    class="mt-1 w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring focus:ring-indigo-500 focus:outline-none"
                />
                <label
                    for="description"
                    class="mt-1 block text-xs font-medium text-gray-700 sm:text-sm"
                    >Description<sup class="text-red-500"><b>*</b></sup>
                    :</label
                >
                <textarea
                    name="description"
                    id="description"
                    placeholder="Description de la tâche"
                    rows="5"
                    class="mt-1 w-full resize-none rounded-md border border-gray-300 p-2 shadow-sm focus:ring focus:ring-indigo-500 focus:outline-none"
                ></textarea>
                <label
                    for="dueDate"
                    class="block text-xs font-medium text-gray-700 sm:text-sm"
                    >Date de fin prévue :</label
                >
                <input
                    type="date"
                    id="dueDate"
                    class="mt-1 w-full cursor-pointer rounded-md border border-gray-300 p-2 shadow-sm focus:ring focus:ring-indigo-500 focus:outline-none"
                />
                <input
                    type="submit"
                    value="Ajouter"
                    class="mt-4 w-full cursor-pointer rounded-md bg-green-600 p-2 text-white hover:bg-green-500 focus:ring focus:ring-green-500 focus:outline-none"
                />
            </form>
        </main>
        <script src="./assets/js/menu.js"></script>
        <script src="./assets/js/addTask.js" type="module"></script>
    </body>
</html>
